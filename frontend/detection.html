<!DOCTYPE html>
<html>
<head>

<title>Live Detection | WakeDrive</title>

<link rel="stylesheet" href="css/style.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>

<div class="background-grid"></div> 




<nav class="navbar">

<div class="logo">
🚨WakeDrive🚗
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>



<li><a href="analytics.html">Analytics</a></li>

<li><a href="contact.html">Contact</a></li>

<li><a href="login.html" onclick="logout()">Logout</a></li>

</ul>

</nav>




<section class="section">

<div class="glass-card detection-card">


<p class="subtitle">
 Real-time fatigue detection using computer vision and deep learning.
</p>
<h3>📷Live Camera Feed</h3>
<div class="control-buttons">

<button onclick="startDetection()" class="primary-btn">
▶ Start Detection
</button>

<button onclick="stopDetection()" class="danger-btn">
■ Stop Detection
</button>

</div>




<div class="status-box">

<span class="status-label">
System Status:
</span>

<span id="status" class="status-idle">
Idle
</span>

</div>

</div>

</section>


<script src="js/detection.js"></script>

<script>
function logout(){
localStorage.removeItem("user")
}
</script>

</body>
</html>
